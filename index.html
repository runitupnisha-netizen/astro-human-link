    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          registrations.forEach(function(r) { r.unregister(); });
        });
      }
      try {
        var isStandaloneLaunch =
          (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
          (window.navigator && window.navigator.standalone === true);
        var legacyLaunchPaths = ['/profile', '/inner-world', '/my-chart', '/saved-charts', '/my-cosmos'];
        if (isStandaloneLaunch && legacyLaunchPaths.indexOf(window.location.pathname) !== -1 && !window.location.search && !window.location.hash) {
          window.history.replaceState(null, document.title, '/');
        }
      } catch(e) {}
      var h = window.location.hash || '';
      if (!h.includes('type=recovery')) {
        try { localStorage.removeItem('auth-recovery-pending'); } catch(e) {}
        try { sessionStorage.removeItem('auth-recovery-pending'); } catch(e) {}
        if (h.includes('access_token')) {
          window.history.replaceState(null, document.title, window.location.pathname);
        }
      }
    </script>
