workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: Stellara
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.runitupmedia.stellara
      node: 22.0.0
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build web assets
        script: |
          echo "Building web assets from commit ${CM_COMMIT:-unknown}"
          npm run build
      - name: Verify iOS folder
        script: |
          ls -la ios/ || echo "No ios folder yet"
      - name: Install Capacitor iOS
        script: |
          npm install @capacitor/ios
          npx cap add ios || true
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          if [ ! -f ios/App/Podfile ]; then
            echo "Podfile not found!"
            exit 1
          fi
          cd ios/App && pod install
      - name: Build iOS app
        script: |
          cat > /tmp/export_options.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>Q2Z6W3979Y</string>
              <key>uploadBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App \
            --export-options-plist /tmp/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false