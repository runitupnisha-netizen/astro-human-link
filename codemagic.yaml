workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: Stellara
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ruhjupmedia.stellara
      vars:
        BUNDLE_ID: "com.ruhjupmedia.stellara"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 18.19.0
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Build web assets
        script: |
          npm run build
      - name: Install Capacitor
        script: |
          npm install @capacitor/cli
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
      - name: Build iOS
        script: |
          xcode-build-action \
            workspace="ios/App/App.xcworkspace" \
            scheme="App" \
            config="Release" \
            clean=true \
            archive=true \
            archivePath="/tmp/stellara.xcarchive"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/stellara.xcarchive
    publishing:
      app_store_connect:
        auth: