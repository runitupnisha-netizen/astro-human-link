workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      node: 22.0.0
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web assets
        script: npm run build
      - name: Install Capacitor iOS
        script: npx cap sync ios
      - name: Pod install
        script: cd ios/App && pod install --repo-update
      - name: Build iOS app
        script: |
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > /tmp/AuthKey.p8
          chmod 600 /tmp/AuthKey.p8
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath /tmp/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath /tmp/AuthKey.p8 \
            -authenticationKeyID Z7F742VM7F \
            -authenticationKeyIssuerID fa782600-e1c3-477c-82de-16bb87c42a3d \
            archive \
            DEVELOPMENT_TEAM=Q2Z6W3979Y \
            CODE_SIGN_STYLE=Automatic
          xcodebuild \
            -exportArchive \
            -archivePath /tmp/App.xcarchive \
            -exportOptionsPlist export_options.plist \
            -exportPath /tmp/ipa \
            -authenticationKeyPath /tmp/AuthKey.p8 \
            -authenticationKeyID Z7F742VM7F \
            -authenticationKeyIssuerID fa782600-e1c3-477c-82de-16bb87c42a3d
    artifacts:
      - /tmp/ipa/*.ipa
