workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      groups:
        - ios_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.runitupmedia.stellara
      node: 22.0.0
      vars:
        # RevenueCat iOS public SDK key. This is a publishable client key
        # (safe to ship in the app bundle) consumed by Vite at build time
        # via import.meta.env.VITE_REVENUECAT_IOS_KEY in src/lib/revenuecat.ts.
        VITE_REVENUECAT_IOS_KEY: "appl_aUqQJpyfpgxzzSJcVFyxGCEZEBJ"
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web assets
        script: npm run build
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Pod install
        script: cd ios/App && pod install --repo-update
      - name: Set build number
        script: |
          cd ios/App
          # Derive a monotonically increasing build number from Codemagic's
          # project build counter. Falls back to current ASC build + 1 if
          # BUILD_NUMBER isn't set (e.g. local runs).
          NEW_BUILD_NUMBER=$(($BUILD_NUMBER + 1))
          agvtool new-version -all $NEW_BUILD_NUMBER
          echo "Set CFBundleVersion to $NEW_BUILD_NUMBER"
      - name: Build and export IPA
        script: |
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" | \
            base64 --decode > /tmp/AuthKey.p8
          chmod 600 /tmp/AuthKey.p8
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath /tmp/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath /tmp/AuthKey.p8 \
            -authenticationKeyID D9QU8TNU74 \
            -authenticationKeyIssuerID fa782600-e1c3-477c-82de-16bb87c42a3d \
            archive \
            DEVELOPMENT_TEAM=Q2Z6W3979Y \
            CODE_SIGN_STYLE=Automatic
          xcodebuild \
            -exportArchive \
            -archivePath /tmp/App.xcarchive \
            -exportOptionsPlist export_options.plist \
            -exportPath /tmp/ipa \
            -authenticationKeyPath /tmp/AuthKey.p8 \
            -authenticationKeyID D9QU8TNU74 \
            -authenticationKeyIssuerID fa782600-e1c3-477c-82de-16bb87c42a3d \
            -allowProvisioningUpdates
    artifacts:
      - /tmp/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: D9QU8TNU74
        issuer_id: fa782600-e1c3-477c-82de-16bb87c42a3d
        submit_to_testflight: true
